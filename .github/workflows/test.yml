name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-qml:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install 'PySide6==6.10.2' build
      - run: python -m unittest discover -s tests -v
      - run: sh -n setup.sh run.sh uninstall.sh
      - run: python -m build

  real-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker]
    env:
      PUPPETEER_LIVE_TESTS: '1'
      PUPPETEER_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: 89luca89/distrobox
          ref: 40c3cd724faa434aeb0a23e28776665b92de68bd # 1.8.2.5
          path: .distrobox-test-source
          persist-credentials: false
      - name: Install test dependencies on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
          (cd .distrobox-test-source && ./install --prefix "$HOME/.local")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Allow rootless Podman in the ephemeral runner
        if: matrix.runtime == 'podman'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run real-container tests
        run: python -m unittest discover -s tests -p test_live.py -v
