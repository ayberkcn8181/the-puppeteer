# The Puppeteer: open in Environment definitions and review before creating.
# Recreates a package recipe, not personal data or later modifications.
[python-work]
image="docker.io/library/ubuntu:24.04"
home="${HOME}/.local/share/the-puppeteer/homes/python-work"
additional_packages="git python3 python3-pip python3-venv python3-dev"
nvidia=false
pull=false
start_now=true
root=false
replace=false
init=false
